        font-size: 22px;
        fill: #CC0000;
      }

      .label-eau {
        font-family: Arial;
        font-size: 24px;
        font-weight: bold;
        fill: #0066CC;
      }

      .quartier {
        font-family: Arial;
        font-size: 32px;
        font-weight: bold;
        fill: #FF8C00;
