  <!-- ========================================================= -->
  <!-- ÉTAPE 1 — ARRIVÉE PE25 + VANNE GÉNÉRALE                  -->
  <!-- ========================================================= -->

  <g id="etape-1"
     data-etape="1"
     data-description="Arrivée PE25 et vanne générale">

    <!-- Arrivée principale PE25 -->
    <line class="pe25-principal"
          id="pe25-arrivee"
          x1="1346" y1="1340"
          x2="860" y2="852"/>

    <!-- Point d'entrée -->
    <circle class="vanne"
            cx="1340"
            cy="1340"
            r="10"/>

    <!-- Vanne générale -->
    <circle class="vanne"
            cx="850"
            cy="850"
            r="13"/>

    <!-- Indication -->
    <text x="1170" y="1325"
          class="label-eau"
          text-anchor="middle">
